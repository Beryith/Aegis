
services:

  nats:
    image: nats:latest
    container_name: aegis-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: >
      --jetstream
      --user aegis
      --pass aegis
      --http_port 8222


  postgres:
    image: postgres:17
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 5

  discovery:
    build:
      context: ..
      dockerfile: deployments/dockerfiles/discovery.dockerfile
    container_name: aegis-discovery
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://aegis:aegis@postgres:5432/aegis
      NATS_URL: nats://aegis:aegis@nats:4222
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:9101/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  intelligence:
    build:
      context: ..
      dockerfile: deployments/dockerfiles/intelligence.dockerfile
    container_name: aegis-intelligence
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://aegis:aegis@postgres:5432/aegis
      NATS_URL: nats://aegis:aegis@nats:4222
      NVD_API_KEY: ${NVD_API_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:9102/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  correlator:
    build:
      context: ..
      dockerfile: deployments/dockerfiles/correlator.dockerfile
    container_name: aegis-correlator
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://aegis:aegis@postgres:5432/aegis
      NATS_URL: nats://aegis:aegis@nats:4222
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:9103/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ..
      dockerfile: deployments/dockerfiles/gateway.dockerfile
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DB_URL: host=postgres user=aegis password=aegis dbname=aegis sslmode=disable
      NATS_URL: nats://aegis:aegis@nats:4222
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ai:
    build:
      context: ..
      dockerfile: deployments/dockerfiles/ai.dockerfile
    container_name: aegis-ai
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ~/.aegis:/root/.aegis
    environment:
      DB_URL: postgresql://aegis:aegis@postgres:5432/aegis
      NATS_URL: nats://aegis:aegis@nats:4222
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; exit(0 if u.urlopen('http://localhost:9104/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  aegis-postgres-data:
